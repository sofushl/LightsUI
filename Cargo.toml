[package]
name = "LightsUI"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
gloo-net = { version = "0.7.0", features = ["http"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
topcoat = { version = "0.10.0", features = ["tailwind"] }

[build-dependencies]
topcoat = { version = "0.10.0", default-features = false, features = ["tailwind"] }
